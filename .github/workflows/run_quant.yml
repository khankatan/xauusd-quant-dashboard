name: XAUUSD Quant Engine

on:
  schedule:
    - cron: '*/15 * * * *' # รันทุกๆ 15 นาที
  workflow_dispatch:       # ให้กดปุ่มสั่งรันเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  run-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install yfinance pandas numpy requests

      - name: Run Quant Calculation
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }} # (ไม่บังคับ: ถ้าไม่ใส่จะใช้ Yahoo Finance ฟรีอัตโนมัติ)
        run: python quant_engine.py

      - name: Commit & Push Dashboard Data
        run: |
          git config user.name "Quant-Bot"
          git config user.email "bot@github.com"
          git add data
          git commit -m "Update XAUUSD Quant Signal" || exit 0
          git push
