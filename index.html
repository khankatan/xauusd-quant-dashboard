<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD Quant Dashboard (GitHub Free Engine)</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h4 { margin: 0 0 6px 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .card .val { font-size: 20px; font-weight: 700; }
    .badge-long { color: #10b981; }
    .badge-short { color: #ef4444; }
    .badge-wait { color: #f59e0b; }
    #chart { width: 100%; height: 460px; border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2 style="margin:0;">XAUUSD Quant Signal Dashboard (M15)</h2>
        <small id="meta" style="color:#94a3b8;">กำลังโหลดข้อมูลจาก GitHub...</small>
      </div>
      <button onclick="loadDashboard()" style="background:#2563eb;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;">รีเฟรชข้อมูล</button>
    </div>

    <div class="grid">
      <div class="card">
        <h4>สัญญาณล่าสุด (Signal)</h4>
        <div id="sig-type" class="val">-</div>
        <small id="sig-lot" style="color:#94a3b8;">Lot (พอร์ต 100k): -</small>
      </div>
      <div class="card">
        <h4>จุดเข้า / จุดเลื่อนหน้าทุน (BE+)</h4>
        <div id="sig-entry" class="val">-</div>
        <small id="sig-be" style="color:#fbbf24;">BE Trigger: -</small>
      </div>
      <div class="card">
        <h4>Stop Loss / Take Profit (1:2.25)</h4>
        <div id="sig-sl-tp" class="val" style="font-size:16px;">-</div>
        <small style="color:#94a3b8;">Risk: 0.25% | Daily Lock: +0.30%</small>
      </div>
      <div class="card">
        <h4>สภาวะตลาด (Macro Z-Score)</h4>
        <div id="regime" class="val">-</div>
        <small id="z-vals" style="color:#94a3b8;">Macro Z: - | Fast Z: -</small>
      </div>
    </div>

    <div id="chart"></div>
  </div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#1e293b' }, textColor: '#cbd5e1' },
      grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444'
    });

    async function loadDashboard() {
      const res = await fetch('./data/state.json?t=' + Date.now());
      const data = await res.json();

      document.getElementById('meta').innerText = `อัปเดตล่าสุด: ${data.updated_utc} | แหล่งข้อมูล: ${data.data_source}`;
      
      const sigEl = document.getElementById('sig-type');
      sigEl.innerText = data.signal.type;
      sigEl.className = 'val ' + (data.signal.type === 'LONG' ? 'badge-long' : data.signal.type === 'SHORT' ? 'badge-short' : 'badge-wait');

      document.getElementById('sig-lot').innerText = `แนะนำ Lot (พอร์ต 100k): ${data.signal.lot_size_100k} Lot`;
      document.getElementById('sig-entry').innerText = data.signal.entry ? `$${data.signal.entry}` : `ราคาปัจจุบัน $${data.current_price}`;
      document.getElementById('sig-be').innerText = data.signal.be_trigger ? `เลื่อน SL หน้าทุนที่: $${data.signal.be_trigger}` : 'รอจังหวะ Pullback';
      document.getElementById('sig-sl-tp').innerHTML = data.signal.sl 
        ? `<span style="color:#ef4444;">SL: $${data.signal.sl}</span> | <span style="color:#10b981;">TP: $${data.signal.tp}</span>` : 'ไม่มีออเดอร์เปิดใหม่';

      document.getElementById('regime').innerText = data.regime;
      document.getElementById('z-vals').innerText = `Macro Z: ${data.macro_z} | Fast Z: ${data.fast_z} | ATR: $${data.atr}`;

      candleSeries.setData(data.candles);

      // ลากเส้นมาร์ค Entry, SL, TP บนกราฟเมื่อมีสัญญาณ
      if (data.signal.type !== 'WAIT') {
        candleSeries.createPriceLine({ price: data.signal.entry, color: '#94a3b8', lineWidth: 1, lineStyle: 2, title: 'ENTRY' });
        candleSeries.createPriceLine({ price: data.signal.sl, color: '#ef4444', lineWidth: 2, lineStyle: 0, title: 'SL (0.25%)' });
        candleSeries.createPriceLine({ price: data.signal.be_trigger, color: '#f59e0b', lineWidth: 1, lineStyle: 1, title: 'BE+ Trigger' });
        candleSeries.createPriceLine({ price: data.signal.tp, color: '#10b981', lineWidth: 2, lineStyle: 0, title: 'TP (1:2.25)' });
      }
    }
    loadDashboard();
  </script>
</body>
</html>
